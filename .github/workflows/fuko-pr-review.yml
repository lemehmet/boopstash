# fuko-pr review: basil (Kimi K3.1 Pro on Kimi Code) and sybil (GLM-5.3 on
# the z.ai Coding Plan) review every non-draft PR from this repository.
# Mirrors zapollo's workflow, trimmed to two seats.
#
# Runner: GitHub-hosted. This repository is public, and a self-hosted runner
# on a public repository is one fork PR away from running a stranger's code on
# the fleet. The job-level `if` already refuses fork PRs, but hosted runners
# keep that a policy rather than the only line of defence. The hosted image
# has no `claude` CLI, so the workflow installs a pinned one.
#
# Identity: each seat posts as its own GitHub App when vars.FUKO_<SEAT>_APP_ID
# and secrets.FUKO_<SEAT>_APP_PRIVATE_KEY are set, and the two seats then
# review concurrently. If either mint fails, fuko runs them one after the other
# under a single identity (basil's, else sybil's, else github-actions[bot]).
name: fuko-pr review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'

concurrency:
  group: fuko-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts, skip-review/* branches, PRs labelled review-capped, and
    # never run fork-PR head code with this repo's secrets.
    #
    # review-capped: a PR gets at most five review rounds. Comments from the
    # fifth become follow-up issues instead of more fix commits, and the label
    # stops further rounds, including the ones a rebase of a stacked PR would
    # otherwise start.
    if: ${{ github.event.pull_request.draft == false && !startsWith(github.event.pull_request.head.ref, 'skip-review/') && !contains(github.event.pull_request.labels.*.name, 'review-capped') && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    # Lockstep with job_budget_minutes in .fuko.toml (2 seats * 2100 s + setup,
    # the sequential worst case).
    timeout-minutes: 80
    permissions:
      contents: read # reads PR data + posts comments only; no commits/pushes
      pull-requests: write
      issues: write
    steps:
      - name: Mint fuko-basil app token
        id: app-token-basil
        if: ${{ vars.FUKO_BASIL_APP_ID != '' }}
        continue-on-error: true # a failed mint falls back to github-actions[bot] rather than failing the check
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.FUKO_BASIL_APP_ID }}
          private-key: ${{ secrets.FUKO_BASIL_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
          permission-issues: write

      # continue-on-error hides a failed mint from the job status; make it loud.
      - name: Surface App token mint failure
        if: ${{ steps.app-token-basil.outcome == 'failure' }}
        run: echo "::warning title=fuko-basil App token mint failed::check vars.FUKO_BASIL_APP_ID / secrets.FUKO_BASIL_APP_PRIVATE_KEY and the App installation; the seats review one after the other under a single identity"

      - name: Mint fuko-sybil app token
        id: app-token-sybil
        if: ${{ vars.FUKO_SYBIL_APP_ID != '' }}
        continue-on-error: true # as for basil
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.FUKO_SYBIL_APP_ID }}
          private-key: ${{ secrets.FUKO_SYBIL_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
          permission-issues: write

      - name: Surface sybil App token mint failure
        if: ${{ steps.app-token-sybil.outcome == 'failure' }}
        run: echo "::warning title=fuko-sybil App token mint failed::check vars.FUKO_SYBIL_APP_ID / secrets.FUKO_SYBIL_APP_PRIVATE_KEY and the App installation; the seats review one after the other under a single identity"

      - name: Surface missing secrets
        env:
          KIMI_CODE_KEY: ${{ secrets.PRIVATE_KIMI_KEY }}
          ZAI_KEY: ${{ secrets.ZAI_KEY }}
        run: |
          missing=0
          if [ -z "$KIMI_CODE_KEY" ]; then
            echo "::error title=PRIVATE_KIMI_KEY secret is not set::basil (kimi-code) cannot review without it. Mint a key in the Kimi Code Console and add it as the repo secret PRIVATE_KIMI_KEY"
            missing=1
          fi
          if [ -z "$ZAI_KEY" ]; then
            echo "::error title=ZAI_KEY secret is not set::sybil (zai-anthropic) cannot review without it. Add the z.ai Coding Plan key as the repo secret ZAI_KEY"
            missing=1
          fi
          exit "$missing"

      # The PR head is what the agentic seat reads and reviews.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # fuko's configuration, by contrast, comes from the base commit:
      # .fuko.toml picks the container image and seats that run with the
      # secrets below, so a PR must not be able to choose them for its own
      # review. A change to .fuko.toml takes effect from the PR after it
      # merges. (The workflow file itself still runs from the PR's merge ref,
      # as every `pull_request` workflow does; write access to this repository
      # remains the trust boundary, and forks never reach this job.)
      - name: Read fuko config from the base commit
        id: base-config
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPO: ${{ github.repository }}
        run: |
          config="$RUNNER_TEMP/base.fuko.toml"
          if gh api "repos/$REPO/contents/.fuko.toml?ref=$BASE_SHA" \
               -H "Accept: application/vnd.github.raw" > "$config" 2>/dev/null; then
            echo "path=$config" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=No .fuko.toml on the base branch::nothing to review with until a .fuko.toml reaches the base branch"
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.22"

      # The agentic seat runs headless Claude Code as a subprocess. Pinned: an
      # unpinned install resolves `latest`, so an upstream release could change
      # the agentic driver under us with no repo change. 2.1.283 is what the
      # fleet's light runners carry. Bump deliberately.
      - name: Install Claude Code harness
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.283
          claude --version

      - name: Review
        if: ${{ steps.base-config.outputs.path != '' }}
        env:
          FUKO_CONFIG: ${{ steps.base-config.outputs.path }}
          GITHUB_TOKEN: ${{ steps.app-token-basil.outputs.token || steps.app-token-sybil.outputs.token || github.token }}
          FUKO_GITHUB_TOKEN_BASIL: ${{ steps.app-token-basil.outputs.token }}
          FUKO_GITHUB_TOKEN_SYBIL: ${{ steps.app-token-sybil.outputs.token }}
          # basil's Kimi Code membership key; the kimi-code preset reads
          # KIMI_CODE_KEY.
          KIMI_CODE_KEY: ${{ secrets.PRIVATE_KIMI_KEY }}
          # sybil's z.ai Coding Plan key; the zai-anthropic preset reads ZAI_KEY.
          ZAI_KEY: ${{ secrets.ZAI_KEY }}
          CLAUDE_CODE_DISABLE_UNKNOWN_MODEL_WINDOW_ENFORCEMENT: '1'
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
          CLAUDE_CODE_DISABLE_NONSTREAMING_FALLBACK: '1'
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # Pin MUST equal [fuko].github_ref in .claude/project.toml (v0.7.8).
          uvx --from "git+https://github.com/lemehmet/fuko-pr@d75529b1d7205b11357b3210a87bc195175e8118" \
            fuko review --config "$FUKO_CONFIG" --pr-url "$PR_URL" 2>&1 | tee "$RUNNER_TEMP/fuko-review.log"
          exit "${PIPESTATUS[0]}"
