# ivy: Claude on a Claude subscription, the same seat as fuko-pr's and
# mepro's. Headless Claude Code reviewing with a Claude model: no gateway, no
# translator, so it runs on a GitHub-hosted runner. `auth = "subscription"`
# is the intent here, the inverse of the other seats' pin: the workflow
# exports a `claude setup-token` (secret FUKO_IVY_CLAUDE_OAUTH_TOKEN) as
# CLAUDE_CODE_OAUTH_TOKEN, and fuko strips it from every api-key seat's
# environment, so basil and sybil never see it. One subscription seat per
# round. max_context is the safe side: too high compacts after the plan's
# real limit and the review dies late. No tool_timeout: Claude answers well
# inside the default 800 s.
[[review.models]]
provider = "anthropic"
name = "claude-opus-5-5"
max_context = 200000
auth = "subscription"
backend = "agentic"
token_env = "FUKO_GITHUB_TOKEN_IVY"
role = "active"
